services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payflow}:${POSTGRES_PASSWORD:-payflow}@db:5432/${POSTGRES_DB:-payflow}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payflow}:${POSTGRES_PASSWORD:-payflow}@db:5432/payflow_test
      PAYFLOW_WEBHOOK_SECRET: ${PAYFLOW_WEBHOOK_SECRET:-whsec_test_123}
    ports:
      - "8000:8000"

volumes:
  pgdata:
