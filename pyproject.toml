[project]
name = "payflow-service"
version = "0.1.0"
description = "Corporate card operations ledger fed by PayFlow webhooks"
authors = [
    {name = "nikitabudeisky",email = "nbud@molfar.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.0.36,<2.1)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic (>=2.14.4,<3.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-asyncio = "^1.5.0"
httpx = "^0.28.1"
ruff = "^0.17.6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
